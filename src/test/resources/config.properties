base.url=https://www.noon.com/egypt-ar/
# The account area is a separate host; noon.com/egypt-ar/profile/ is a catalogue page, not a form.
profile.url=https://account.noon.com/egypt-ar/profile/
browser=chrome
headless=false
# Share one browser profile across tests so the suite signs in once: noon locks the account after
# repeated logins in quick succession. The profile lives in target/, so 'mvn clean' resets it.
reuse.session=true
explicit.wait.seconds=40
page.load.timeout.seconds=60

# Credentials are intentionally not committed. Set them here locally, or pass them at run time:
#   mvn test -Duser.email=you@example.com -Duser.password=secret
user.email=dummy email
user.password=dummy password

search.term=ساعة

# Dummy card data. Never saved, never submitted for payment - see CheckoutPage.
card.number=4111111111111111
card.holder.name=TEST USER
card.expiry.month=12
card.expiry.year=30
card.cvv=123

profile.first.name=Amjad
profile.last.name=Tester

